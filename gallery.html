<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery · NEST Lab</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main>
    <section class="section"><div class="container">
      <h1 class="page-title reveal">Gallery</h1>

      <div class="reveal">
        <div class="gyear">2026</div>
        <div class="gallery">
          <figure>
            <div class="slides">
              <div class="track">
                <img src="assets/img/gallery/2026-ksev-1.jpg" alt="KSEV 2026 poster presentation">
                <img src="assets/img/gallery/2026-ksev-2.jpg" alt="KSEV 2026 award ceremony">
              </div>
              <button class="prev" aria-label="Previous photo">‹</button><button class="next" aria-label="Next photo">›</button>
            </div>
            <figcaption><span class="lang-ko">2026 한국엑소좀학회(KSEV)</span><span class="lang-en">KSEV 2026</span></figcaption>
          </figure>
        </div>
      </div>

      <!-- 연도 추가 시 위 블록을 복사해 gyear와 사진만 바꾸면 됨 -->
    </div></section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="assets/js/main.js"></script>
</body>
</html>
